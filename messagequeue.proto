syntax = "proto3";

package messagequeue;

service MessageQueue {
  // Enqueue a message to a specific queue
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  
  // Dequeue a message from a specific queue
  rpc Dequeue(DequeueRequest) returns (DequeueResponse);
  
  // Peek at the next message without removing it
  rpc Peek(PeekRequest) returns (PeekResponse);
  
  // Get queue size
  rpc GetQueueSize(QueueSizeRequest) returns (QueueSizeResponse);
  
  // List all queues
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse);
}

message EnqueueRequest {
  string queue_name = 1;
  string message = 2;
  int32 priority = 3; // Optional priority (higher = more priority)
}

message EnqueueResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

message DequeueRequest {
  string queue_name = 1;
}

message DequeueResponse {
  bool success = 1;
  string message = 2;
  string message_id = 3;
  string error = 4;
}

message PeekRequest {
  string queue_name = 1;
}

message PeekResponse {
  bool success = 1;
  string message = 2;
  string message_id = 3;
  string error = 4;
}

message QueueSizeRequest {
  string queue_name = 1;
}

message QueueSizeResponse {
  int32 size = 1;
  string error = 2;
}

message ListQueuesRequest {}

message ListQueuesResponse {
  repeated string queue_names = 1;
}